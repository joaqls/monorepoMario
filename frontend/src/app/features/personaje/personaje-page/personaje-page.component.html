<h1>Listado de elementos</h1>

<button (click)="abrirFormulario()">Añadir nuevo</button>

<div *ngFor="let personaje of personajes$ | async">

</div>


<app-new-personaje
  *ngIf="mostrarFormulario"
  (cerrar)="cerrarFormulario()">
</app-new-personaje>
