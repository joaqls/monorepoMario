<div class="card">
  <h3>{{ personaje.nombre }}</h3>
  <p><strong>Tipo:</strong> {{ personaje.tipo }}</p>
  <p><strong>Poder:</strong> {{ personaje.poder }}</p>
  <p><strong>Mundo:</strong> {{ personaje.mundo }}</p>

  <button (click)="abrirEliminar()">Eliminar</button>

<app-delete-personaje 
  *ngIf="mostrarEliminar"
  [itemId]="personaje.id"
  (cerrar)="mostrarEliminar = false">
</app-delete-personaje>

</div>
